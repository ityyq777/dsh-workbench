<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>DSH 弹幕层</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      #field {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .chip {
        position: absolute;
        left: 0;
        top: 0;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 3px 11px;
        border-radius: 999px;
        border: 1px solid var(--bd, rgba(0, 0, 0, 0.14));
        background: var(--chip, rgba(255, 255, 255, 0.74));
        backdrop-filter: blur(7px) saturate(1.15);
        -webkit-backdrop-filter: blur(7px) saturate(1.15);
        color: var(--fg, #111827);
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.01em;
        white-space: nowrap;
        opacity: var(--op, 0.92);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
        will-change: transform;
        backface-visibility: hidden;
      }
      .chip.plain {
        background: none;
        border-color: transparent;
        box-shadow: none;
        padding: 2px 3px;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }
      .tone-accent {
        color: var(--accent, #2563eb);
        border-color: var(--accent, #2563eb);
      }
      .tone-success {
        color: var(--ok, #15803d);
        border-color: var(--ok, #15803d);
      }
      .tone-warn {
        color: var(--warn, #b45309);
        border-color: var(--warn, #b45309);
      }
      .tone-danger {
        color: var(--danger, #b91c1c);
        border-color: var(--danger, #b91c1c);
      }
    </style>
  </head>
  <body>
    <div id="field"></div>
    <script src="renderer.js"></script>
  </body>
</html>
